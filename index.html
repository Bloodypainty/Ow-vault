<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OW Vault – Ma Collection</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#07070a; --bg2:#0d0d12; --bg3:#121218; --bg4:#181820; --bg5:#1e1e28;
  --border:rgba(255,255,255,0.06); --border2:rgba(255,255,255,0.12);
  --text:#eeeef2; --text-muted:#5a5a68; --text-dim:#9090a0;
  --ow:#ff8a1e; --ow2:#4fc3ff;
  --mythic-a:#ff5fa8; --mythic-b:#8c5cf0;
  --legendary:#ffb93d; --epic:#b76ef0; --rare:#4fa8e8; --common:#9099a2;
  --tank:#4a9eff; --damage:#f2544f; --support:#43d17f;
  --r:8px; --rl:14px; --rx:20px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Exo 2',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 70% 40% at 15% 0%,rgba(255,138,30,0.06),transparent 60%),radial-gradient(ellipse 60% 40% at 90% 100%,rgba(79,195,255,0.05),transparent 60%);pointer-events:none;z-index:0}
#app{display:flex;min-height:100vh;position:relative;z-index:1}

/* SIDEBAR */
#sidebar{width:225px;min-height:100vh;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:100}
.sidebar-logo{padding:26px 22px 20px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-family:'Rajdhani',sans-serif;font-size:1.45rem;font-weight:700;letter-spacing:.14em;background:linear-gradient(135deg,#fff,var(--ow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sidebar-logo span{font-size:.58rem;letter-spacing:.24em;color:var(--text-muted);text-transform:uppercase}
.sidebar-section{padding:16px 18px 5px;font-size:.58rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.sidebar-nav{padding:0 10px}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:var(--r);cursor:pointer;font-family:'Rajdhani',sans-serif;font-size:.94rem;font-weight:500;letter-spacing:.05em;color:var(--text-dim);transition:.22s;margin-bottom:2px;border:1px solid transparent;user-select:none}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;transition:.22s;background:#444450}
.nav-item[data-page=home] .nav-dot{background:var(--ow)}
.nav-item[data-page=tank] .nav-dot{background:var(--tank)}
.nav-item[data-page=damage] .nav-dot{background:var(--damage)}
.nav-item[data-page=support] .nav-dot{background:var(--support)}
.nav-item[data-page=random] .nav-dot{background:linear-gradient(135deg,var(--ow),var(--epic))}
.nav-item.active{color:var(--text);background:var(--bg3)}
.nav-item.active[data-page=home]{border-color:rgba(255,138,30,.25);background:linear-gradient(90deg,rgba(255,138,30,.08),transparent)}
.nav-item.active[data-page=tank]{border-color:rgba(74,158,255,.25);background:linear-gradient(90deg,rgba(74,158,255,.08),transparent)}
.nav-item.active[data-page=damage]{border-color:rgba(242,84,79,.25);background:linear-gradient(90deg,rgba(242,84,79,.08),transparent)}
.nav-item.active[data-page=support]{border-color:rgba(67,209,127,.25);background:linear-gradient(90deg,rgba(67,209,127,.08),transparent)}
.nav-item.active[data-page=random]{border-color:rgba(183,110,240,.25);background:linear-gradient(90deg,rgba(183,110,240,.08),transparent)}
.nav-item.active .nav-dot{box-shadow:0 0 10px currentColor}
.sidebar-bottom{margin-top:auto;padding:14px 10px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px}

/* MAIN */
#main{margin-left:225px;flex:1;padding:34px 38px;min-height:100vh}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;padding-bottom:18px;border-bottom:1px solid var(--border);position:relative;flex-wrap:wrap;gap:12px}
.page-header::after{content:'';position:absolute;bottom:-1px;left:0;width:110px;height:1px}
.page-header.ow-page::after{background:linear-gradient(90deg,var(--ow),transparent)}
.page-header.tank-page::after{background:linear-gradient(90deg,var(--tank),transparent)}
.page-header.damage-page::after{background:linear-gradient(90deg,var(--damage),transparent)}
.page-header.support-page::after{background:linear-gradient(90deg,var(--support),transparent)}
.page-title{font-family:'Rajdhani',sans-serif;font-size:2.1rem;font-weight:700;letter-spacing:.1em;line-height:1}
.ow-accent{color:var(--ow);text-shadow:0 0 40px rgba(255,138,30,.45)}
.tank-accent{color:var(--tank);text-shadow:0 0 40px rgba(74,158,255,.4)}
.damage-accent{color:var(--damage);text-shadow:0 0 40px rgba(242,84,79,.4)}
.support-accent{color:var(--support);text-shadow:0 0 40px rgba(67,209,127,.4)}
.count-badge{font-size:.72rem;padding:5px 12px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);color:var(--text-dim);font-family:'Rajdhani',sans-serif;letter-spacing:.1em}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--text-muted);font-size:.78rem;cursor:pointer;margin-bottom:14px;font-family:'Rajdhani',sans-serif;letter-spacing:.06em;font-weight:600;transition:.2s}
.backlink:hover{color:var(--text)}

/* GRID & CARDS (skins) */
.skins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.skin-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;position:relative}
.skin-card:hover{transform:translateY(-5px);box-shadow:0 12px 34px rgba(0,0,0,.4)}
.skin-card[data-rarity=Mythic]{border-color:rgba(255,95,168,.28)}
.skin-card[data-rarity=Legendary]{border-color:rgba(255,185,61,.25)}
.skin-card[data-rarity=Epic]{border-color:rgba(183,110,240,.25)}
.skin-card[data-rarity=Rare]{border-color:rgba(79,168,232,.22)}
.skin-card[data-rarity=Mythic]:hover{box-shadow:0 12px 40px rgba(255,95,168,.2),0 0 0 1px rgba(255,95,168,.4)}
.skin-card[data-rarity=Legendary]:hover{box-shadow:0 12px 40px rgba(255,185,61,.2),0 0 0 1px rgba(255,185,61,.4)}
.skin-card[data-rarity=Epic]:hover{box-shadow:0 12px 40px rgba(183,110,240,.2),0 0 0 1px rgba(183,110,240,.4)}
.skin-card[data-rarity=Rare]:hover{box-shadow:0 12px 40px rgba(79,168,232,.2),0 0 0 1px rgba(79,168,232,.4)}
.rarity-bar{height:3px;width:100%}
.rarity-bar.Mythic{background:linear-gradient(90deg,var(--mythic-a),var(--mythic-b))}
.rarity-bar.Legendary{background:linear-gradient(90deg,var(--legendary),rgba(255,185,61,.2))}
.rarity-bar.Epic{background:linear-gradient(90deg,var(--epic),rgba(183,110,240,.2))}
.rarity-bar.Rare{background:linear-gradient(90deg,var(--rare),rgba(79,168,232,.2))}
.rarity-bar.Common{background:var(--common);opacity:.4}
.skin-info{padding:13px 14px 14px}
.skin-name{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.98rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.skin-meta{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:5px}
.skin-rarity-label{font-size:.63rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.skin-rarity-label.Mythic{background:linear-gradient(90deg,var(--mythic-a),var(--mythic-b));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.skin-rarity-label.Legendary{color:var(--legendary)}.skin-rarity-label.Epic{color:var(--epic)}.skin-rarity-label.Rare{color:var(--rare)}.skin-rarity-label.Common{color:var(--common)}
.skin-variant-tag{font-size:.63rem;color:var(--ow);margin-top:5px;font-weight:600}
.skin-note{font-size:.68rem;color:var(--text-muted);margin-top:4px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0;transition:.2s;z-index:10}
.skin-card:hover .card-actions{opacity:1}
.skin-card.selectable .card-actions{display:none!important}
.card-btn{width:29px;height:29px;border-radius:7px;border:1px solid rgba(255,255,255,.1);cursor:pointer;font-size:.72rem;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);transition:.2s;background:rgba(255,255,255,.08);color:#fff}
.card-btn-edit{background:rgba(255,255,255,.12);color:#fff}
.card-btn-delete{background:rgba(220,50,50,.4);color:#ffb0b0}
.card-btn:hover{transform:scale(1.12)}

/* HERO GRID */
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.hero-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px 14px;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;text-align:center}
.hero-card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.hero-avatar{width:54px;height:54px;border-radius:50%;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.05rem;color:#07070a}
.hero-card .hname{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.92rem;letter-spacing:.03em;margin-bottom:3px}
.hero-card .hcount{font-size:.68rem;color:var(--text-muted)}
.hero-card .hcount b{color:var(--ow)}

/* SEARCH & FILTER */
.search-bar{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.search-input-wrap{position:relative;flex:1;max-width:340px}
.search-input-wrap input{padding-left:36px}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.9rem;pointer-events:none}
.filter-bar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
.filter-btn{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-muted);font-size:.72rem;cursor:pointer;transition:.22s;font-family:'Exo 2',sans-serif}
.filter-btn:hover{background:var(--bg3);color:var(--text-dim);border-color:var(--border2)}
.filter-btn.active{background:var(--bg4);color:var(--text);border-color:var(--border2)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);backdrop-filter:blur(10px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rx);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;transform:scale(.93) translateY(20px);transition:transform .25s;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal-overlay.open .modal{transform:scale(1) translateY(0)}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 26px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:2}
.modal-title{font-family:'Rajdhani',sans-serif;font-size:1.35rem;font-weight:700;letter-spacing:.06em}
.modal-close{width:32px;height:32px;border-radius:8px;border:1px solid var(--border2);background:var(--bg3);color:var(--text-dim);cursor:pointer;font-size:1.05rem;transition:.2s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--bg5);color:var(--text)}
.modal-body{padding:22px}

/* FORMS */
.form-section{background:var(--bg3);border:1px solid var(--border);border-radius:var(--rl);padding:20px 22px;margin-bottom:16px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.form-row.single{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:6px}
label{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
input[type=text],select{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);padding:10px 13px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:.9rem;outline:none;transition:.2s;width:100%}
textarea{background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);padding:10px 13px;color:var(--text);font-family:'Exo 2',sans-serif;font-size:.9rem;outline:none;transition:.2s;width:100%;resize:vertical;min-height:60px}
textarea:focus{border-color:rgba(255,138,30,.4);box-shadow:0 0 0 3px rgba(255,138,30,.08)}
input:focus,select:focus{border-color:rgba(255,138,30,.4);box-shadow:0 0 0 3px rgba(255,138,30,.08)}
select option{background:var(--bg4)}
.rarity-select{display:flex;gap:7px;flex-wrap:wrap}
.rarity-opt{padding:7px 15px;border-radius:20px;font-size:.78rem;font-weight:700;cursor:pointer;border:2px solid transparent;font-family:'Rajdhani',sans-serif;letter-spacing:.05em;color:var(--text-dim);background:var(--bg4);transition:.2s}
.rarity-opt.active{color:#07070a;border-color:rgba(255,255,255,.25)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 22px;border-radius:var(--r);border:none;cursor:pointer;font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.92rem;letter-spacing:.06em;transition:.2s;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,rgba(255,138,30,.28),rgba(255,138,30,.14));border:1px solid rgba(255,138,30,.4);color:#fff}
.btn-primary:hover{background:linear-gradient(135deg,rgba(255,138,30,.36),rgba(255,138,30,.2));box-shadow:0 4px 16px rgba(255,138,30,.2)}
.btn-danger{background:rgba(220,50,50,.2);border:1px solid rgba(220,50,50,.4);color:#ff8a8a}
.btn-danger:hover{background:rgba(220,50,50,.32)}
.btn-sm{padding:7px 14px;font-size:.8rem}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-muted)}
.btn-ghost:hover{background:var(--bg3);color:var(--text)}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:20px;justify-content:flex-end}
.btn:disabled{opacity:.35;cursor:not-allowed}

/* TOAST */
#toast{position:fixed;bottom:26px;right:26px;background:var(--bg4);border:1px solid var(--border2);border-radius:var(--r);padding:13px 20px;font-size:.87rem;color:var(--text);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:300px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#toast.show{transform:translateY(0);opacity:1}
#toast.success{border-color:rgba(67,209,127,.4)}
#toast.error{border-color:rgba(220,50,50,.4)}

/* EMPTY */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 20px;text-align:center;color:var(--text-muted);gap:14px;grid-column:1/-1}
.empty-state .icon{font-size:3.2rem;opacity:.5}
.empty-state p{font-size:.88rem;line-height:1.6}

/* HOME */
.home-stats{display:flex;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.stat-block{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px 22px;flex:1;min-width:130px}
.stat-number{font-family:'Rajdhani',sans-serif;font-size:2.1rem;font-weight:700;line-height:1}
.stat-label{font-size:.66rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.rarity-overview{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px 22px;margin-bottom:26px}
.rarity-overview .lbl{font-size:.66rem;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.rarity-track{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--bg4)}
.rarity-track span{height:100%}
.rarity-track-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:.72rem;color:var(--text-dim)}
.rarity-track-legend .li{display:flex;align-items:center;gap:6px}
.rarity-track-legend .sw{width:9px;height:9px;border-radius:3px}
.home-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:30px}
.game-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rx);padding:24px 20px;cursor:pointer;transition:transform .25s,box-shadow .25s,border-color .25s;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.game-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px}
.game-card:hover{transform:translateY(-5px)}
.game-card.tank{border-color:rgba(74,158,255,.2)}.game-card.tank::before{background:linear-gradient(90deg,transparent,var(--tank),transparent);opacity:.5}
.game-card.tank:hover{box-shadow:0 10px 36px rgba(74,158,255,.15);border-color:rgba(74,158,255,.35)}
.game-card.tank .game-card-name{color:var(--tank)}
.game-card.damage{border-color:rgba(242,84,79,.2)}.game-card.damage::before{background:linear-gradient(90deg,transparent,var(--damage),transparent);opacity:.5}
.game-card.damage:hover{box-shadow:0 10px 36px rgba(242,84,79,.15);border-color:rgba(242,84,79,.35)}
.game-card.damage .game-card-name{color:var(--damage)}
.game-card.support{border-color:rgba(67,209,127,.2)}.game-card.support::before{background:linear-gradient(90deg,transparent,var(--support),transparent);opacity:.5}
.game-card.support:hover{box-shadow:0 10px 36px rgba(67,209,127,.15);border-color:rgba(67,209,127,.35)}
.game-card.support .game-card-name{color:var(--support)}
.game-card.rand{border-color:rgba(183,110,240,.2)}.game-card.rand::before{background:linear-gradient(90deg,transparent,var(--epic),transparent);opacity:.5}
.game-card.rand:hover{box-shadow:0 10px 36px rgba(183,110,240,.15);border-color:rgba(183,110,240,.35)}
.game-card.rand .game-card-name{background:linear-gradient(135deg,var(--epic),var(--ow));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.game-card-icon{font-size:1.8rem}
.game-card-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.15rem;letter-spacing:.04em}
.game-card-count{color:var(--text-muted);font-size:.76rem}

/* RANDOMIZER */
.rand-page{max-width:680px}
.rand-step{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:20px 24px;margin-bottom:16px}
.rand-step-title{display:flex;align-items:center;gap:10px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;letter-spacing:.07em;color:var(--text-dim);margin-bottom:14px}
.step-num{width:22px;height:22px;border-radius:50%;background:var(--bg4);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:.75rem;color:var(--text);flex-shrink:0}
.role-filter-grid{display:flex;gap:8px;flex-wrap:wrap}
.role-filter-pill{padding:9px 16px;border-radius:var(--r);border:1px solid var(--border2);background:var(--bg3);font-family:'Rajdhani',sans-serif;font-weight:600;font-size:.85rem;letter-spacing:.05em;color:var(--text-dim);transition:.22s;cursor:pointer}
.role-filter-pill.active{color:#fff}
.role-filter-pill[data-role=all].active{background:rgba(255,138,30,.14);border-color:rgba(255,138,30,.4);color:var(--ow)}
.role-filter-pill[data-role=tank].active{background:rgba(74,158,255,.14);border-color:rgba(74,158,255,.4);color:var(--tank)}
.role-filter-pill[data-role=damage].active{background:rgba(242,84,79,.14);border-color:rgba(242,84,79,.4);color:var(--damage)}
.role-filter-pill[data-role=support].active{background:rgba(67,209,127,.14);border-color:rgba(67,209,127,.4);color:var(--support)}
.rand-btn{font-size:1.05rem;padding:14px 34px;border-radius:var(--rl);background:linear-gradient(135deg,rgba(255,138,30,.22),rgba(183,110,240,.2));border:1px solid rgba(255,138,30,.4);color:#fff;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.08em;cursor:pointer;transition:.25s;display:flex;align-items:center;gap:10px}
.rand-btn:hover{box-shadow:0 8px 30px rgba(255,138,30,.25)}
@keyframes spinBounce{0%{transform:scale(1);opacity:1}50%{transform:scale(.95);opacity:.65}100%{transform:scale(1);opacity:1}}
.rand-btn.spinning{animation:spinBounce .4s ease}
.rand-result-card{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--rx);overflow:hidden;position:relative;transition:.25s;padding:26px 22px;text-align:center;margin-top:6px}
.rand-result-card[data-rarity=Mythic]{border-color:rgba(255,95,168,.35);box-shadow:0 0 24px rgba(255,95,168,.1)}
.rand-result-card[data-rarity=Legendary]{border-color:rgba(255,185,61,.35);box-shadow:0 0 24px rgba(255,185,61,.1)}
.rand-result-card[data-rarity=Epic]{border-color:rgba(183,110,240,.35);box-shadow:0 0 24px rgba(183,110,240,.1)}
.rand-result-card[data-rarity=Rare]{border-color:rgba(79,168,232,.35);box-shadow:0 0 24px rgba(79,168,232,.1)}
.rand-result-avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-family:'Rajdhani',sans-serif;font-weight:700;font-size:1.5rem;color:#07070a}

/* SELECT MODE */

.skin-card.selected{outline:2px solid var(--ow);outline-offset:2px;box-shadow:0 0 20px rgba(255,138,30,.25)}
.skin-card.selected::after{content:'✓';position:absolute;top:8px;left:8px;width:22px;height:22px;background:var(--ow);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.75rem;color:#07070a;font-weight:700;z-index:20}

/* VARIANTS (skin detail modal) */
.variant-section{margin-top:6px}
.variant-section .vtitle{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ow);font-weight:700;margin-bottom:10px}
.variant-chip{display:inline-flex;align-items:center;gap:8px;background:var(--bg4);border:1px solid var(--border2);border-radius:20px;padding:6px 8px 6px 12px;font-size:.8rem;margin:0 7px 7px 0}
.variant-chip.owned{border-color:rgba(255,138,30,.5)}
.vdot{width:8px;height:8px;border-radius:50%;background:var(--text-muted);cursor:pointer}
.variant-chip.owned .vdot{background:var(--ow)}
.vname{cursor:pointer}
.vdel{cursor:pointer;color:var(--text-muted);font-size:.78rem;width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.vdel:hover{color:#ff8a8a;background:rgba(220,50,50,.15)}
.variant-add-row{display:flex;gap:8px;margin-top:8px}
.variant-add-row input{flex:1}

@media (max-width:760px){
  #sidebar{position:relative;width:100%;min-height:auto;flex-direction:row;flex-wrap:wrap;padding:10px}
  #main{margin-left:0;padding:22px 16px}
  .sidebar-nav{display:flex;flex-wrap:wrap;padding:4px}
  .sidebar-bottom{margin-top:0}
}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-logo">
      <h1>OW VAULT</h1>
      <span>Overwatch · Bloody</span>
    </div>
    <div class="sidebar-section">Collection</div>
    <nav class="sidebar-nav">
      <div class="nav-item" data-page="home" onclick="navigate('home')"><div class="nav-dot"></div>Accueil</div>
      <div class="nav-item" data-page="tank" onclick="navigate('tank')"><div class="nav-dot"></div>Tank</div>
      <div class="nav-item" data-page="damage" onclick="navigate('damage')"><div class="nav-dot"></div>Dégâts</div>
      <div class="nav-item" data-page="support" onclick="navigate('support')"><div class="nav-dot"></div>Soutien</div>
    </nav>
    <div class="sidebar-section">Outils</div>
    <nav class="sidebar-nav">
      <div class="nav-item" data-page="random" onclick="navigate('random')"><div class="nav-dot"></div>🎲 Randomizer</div>
    </nav>
    <div class="sidebar-bottom">
      <button class="btn btn-ghost btn-sm" onclick="exportData()">⬇ Exporter</button>
      <label class="btn btn-ghost btn-sm" style="cursor:pointer;justify-content:center;">⬆ Importer<input type="file" accept=".json" style="display:none" onchange="handleImport(event)"></label>
      <button class="btn btn-ghost btn-sm" onclick="openHelpModal()">🆘 Aide</button>
    </div>
  </aside>
  <main id="main"><div id="page-content"></div></main>
</div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnBg(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Détail</span>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>
<div id="toast"></div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════
   HERO ROSTER
   ═══════════════════════════════════════════════════════ */
const HEROES = [
  {id:'dmon', name:'D.Mon', role:'tank'},{id:'dva', name:'D.Va', role:'tank'},
  {id:'domina', name:'Domina', role:'tank'},{id:'doomfist', name:'Doomfist', role:'tank'},
  {id:'hazard', name:'Hazard', role:'tank'},{id:'junkerqueen', name:'Junker Queen', role:'tank'},
  {id:'mauga', name:'Mauga', role:'tank'},{id:'orisa', name:'Orisa', role:'tank'},
  {id:'ramattra', name:'Ramattra', role:'tank'},{id:'reinhardt', name:'Reinhardt', role:'tank'},
  {id:'roadhog', name:'Roadhog', role:'tank'},{id:'sigma', name:'Sigma', role:'tank'},
  {id:'winston', name:'Winston', role:'tank'},{id:'wreckingball', name:'Wrecking Ball', role:'tank'},
  {id:'zarya', name:'Zarya', role:'tank'},
  {id:'anran', name:'Anran', role:'damage'},{id:'ashe', name:'Ashe', role:'damage'},
  {id:'bastion', name:'Bastion', role:'damage'},{id:'cassidy', name:'Cassidy', role:'damage'},
  {id:'echo', name:'Echo', role:'damage'},{id:'emre', name:'Emre', role:'damage'},
  {id:'freja', name:'Freja', role:'damage'},{id:'genji', name:'Genji', role:'damage'},
  {id:'hanzo', name:'Hanzo', role:'damage'},{id:'junkrat', name:'Junkrat', role:'damage'},
  {id:'mei', name:'Mei', role:'damage'},{id:'pharah', name:'Pharah', role:'damage'},
  {id:'reaper', name:'Reaper', role:'damage'},{id:'shion', name:'Shion', role:'damage'},
  {id:'sierra', name:'Sierra', role:'damage'},{id:'sojourn', name:'Sojourn', role:'damage'},
  {id:'soldier76', name:'Soldier: 76', role:'damage'},{id:'sombra', name:'Sombra', role:'damage'},
  {id:'symmetra', name:'Symmetra', role:'damage'},{id:'torbjorn', name:'Torbjörn', role:'damage'},
  {id:'tracer', name:'Tracer', role:'damage'},{id:'vendetta', name:'Vendetta', role:'damage'},
  {id:'venture', name:'Venture', role:'damage'},{id:'widowmaker', name:'Widowmaker', role:'damage'},
  {id:'ana', name:'Ana', role:'support'},{id:'baptiste', name:'Baptiste', role:'support'},
  {id:'brigitte', name:'Brigitte', role:'support'},{id:'illari', name:'Illari', role:'support'},
  {id:'jetpackcat', name:'Jetpack Cat', role:'support'},{id:'juno', name:'Juno', role:'support'},
  {id:'kiriko', name:'Kiriko', role:'support'},{id:'lifeweaver', name:'Lifeweaver', role:'support'},
  {id:'lucio', name:'Lúcio', role:'support'},{id:'mercy', name:'Mercy', role:'support'},
  {id:'mizuki', name:'Mizuki', role:'support'},{id:'moira', name:'Moira', role:'support'},
  {id:'wuyang', name:'Wuyang', role:'support'},{id:'zenyatta', name:'Zenyatta', role:'support'},
];
const HEROMAP = {}; HEROES.forEach(h=>HEROMAP[h.id]=h);
const ROLE_INFO = {
  tank:{label:'Tank', hex:'#4a9eff', icon:'🛡️'},
  damage:{label:'Dégâts', hex:'#f2544f', icon:'⚔️'},
  support:{label:'Soutien', hex:'#43d17f', icon:'✚'}
};
const RARITIES = ['Common','Rare','Epic','Legendary','Mythic'];
const RARITY_LABEL = {Common:'Commun',Rare:'Rare',Epic:'Épique',Legendary:'Légendaire',Mythic:'Mythique'};
const RARITY_HEX = {Common:'#9099a2',Rare:'#4fa8e8',Epic:'#b76ef0',Legendary:'#ffb93d',Mythic:'#ff5fa8'};
function hasVariants(rarity){ return rarity==='Legendary' || rarity==='Mythic'; }

/* ═══════════════════════════════════════════════════════
   DATA
   ═══════════════════════════════════════════════════════ */
const DB_KEY = 'owvault_data';
const DEFAULT_DATA = { skins: [] };
function loadData(){
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_DATA));
    const saved = JSON.parse(raw);
    if(!saved.skins) saved.skins=[];
    saved.skins.forEach(s=>{ if(!s.variants) s.variants=[]; });
    return saved;
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_DATA)); }
}
function saveData(d){ localStorage.setItem(DB_KEY, JSON.stringify(d)); }
function generateId(p){ return p+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7); }

function exportData(){
  const d = loadData();
  const blob = new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url;
  a.download = `owvault_${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(url);
}
function importDataFile(file){
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = e=>{
      try{
        const raw = JSON.parse(e.target.result);
        if(!raw || !Array.isArray(raw.skins)) throw new Error('Format non reconnu (attendu : export OW Vault)');
        saveData(raw); res(raw);
      }catch(err){ rej(err instanceof Error ? err : new Error('JSON invalide')); }
    };
    r.readAsText(file);
  });
}
async function handleImport(e){
  const f = e.target.files[0]; if(!f) return;
  try{ const d = await importDataFile(f); showToast(`Import réussi ✓ (${d.skins.length} skins)`); refresh(); }
  catch(err){ showToast('Erreur : '+err.message,'error'); }
  e.target.value='';
}

/* ═══════════════════════════════════════════════════════
   APP / NAVIGATION
   ═══════════════════════════════════════════════════════ */
let currentPage = 'home';
let currentHeroId = null;

function navigate(page){
  currentPage = page; currentHeroId = null;
  _exitSelectMode(true);
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===page));
  const c = document.getElementById('page-content');
  if(page==='home') c.innerHTML = renderHome();
  else if(page==='tank'||page==='damage'||page==='support') c.innerHTML = renderRolePage(page);
  else if(page==='random') c.innerHTML = renderRandomPage();
  else c.innerHTML = '<p>404</p>';
}
function openHeroPage(heroId){
  currentHeroId = heroId;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active', el.dataset.page===HEROMAP[heroId].role));
  document.getElementById('page-content').innerHTML = renderHeroPage(heroId);
}
function refresh(){
  if(currentHeroId) openHeroPage(currentHeroId);
  else navigate(currentPage);
}

/* Modal */
function openModal(title, body){
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('open'); document.body.style.overflow=''; }
function closeModalOnBg(e){ if(e.target===document.getElementById('modal-overlay')) closeModal(); }
function openHelpModal(){
  openModal("🆘 Besoin d'aide ?", `
    <div style="display:flex;flex-direction:column;gap:16px">
      <p style="color:var(--text-dim);font-size:.88rem;line-height:1.6;margin:0">
        Ce site est un fichier statique (pas de serveur). Avant d'aller demander de l'aide, vérifie ces pièges classiques :
      </p>
      <div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;font-size:.85rem;color:var(--text-dim);line-height:1.7">
        <strong style="color:var(--text)">🔄 Rien ne se passe / une action semble ignorée</strong><br>
        → Rafraîchissement forcé : <kbd>Ctrl+Maj+R</kbd> (Windows) ou <kbd>Cmd+Maj+R</kbd> (Mac).<br><br>
        <strong style="color:var(--text)">📄 Après un remplacement de fichier sur GitHub</strong><br>
        → Attends 1-2 min que GitHub Pages se mette à jour, puis re-teste en navigation privée.<br><br>
        <strong style="color:var(--text)">💾 Peur de perdre tes données</strong><br>
        → Clique <strong>⬇ Exporter</strong> régulièrement pour sauvegarder ta collection en JSON.
      </div>
      <button class="btn btn-danger" style="justify-content:center" onclick="resetAllData()">🗑 Réinitialiser toute la collection</button>
      <a href="https://claude.ai/new" target="_blank" rel="noopener" class="btn btn-primary" style="text-decoration:none;justify-content:center">💬 Ouvrir une conversation avec Claude</a>
    </div>`);
}
function resetAllData(){
  if(!confirm('Cette action supprimera définitivement toute ta collection. Continuer ?')) return;
  saveData({skins:[]});
  closeModal(); showToast('Collection réinitialisée ✓'); navigate('home');
}

/* Toast */
let _tt;
function showToast(msg,type='success'){
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = `show ${type}`;
  clearTimeout(_tt); _tt = setTimeout(()=>{ t.className=''; }, 3000);
}

/* Utils */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(name){ return name.replace(/[^A-Za-zÀ-ÿ0-9 .:]/g,'').split(/[\s.:]+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase(); }
function heroGradient(role){ const c=ROLE_INFO[role].hex; return `linear-gradient(135deg, ${c}, ${shade(c,-18)})`; }
function shade(hex,pct){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+Math.round(255*pct/100), g=((n>>8)&255)+Math.round(255*pct/100), b=(n&255)+Math.round(255*pct/100);
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0');
}
function idTimestamp(id){ const parts=String(id).split('_'); const ts=parseInt(parts[1]); return isNaN(ts)?0:ts; }
function skinsForHero(heroId){ return loadData().skins.filter(s=>s.heroId===heroId); }
function ownedSkinCount(heroId){ return skinsForHero(heroId).length; }

/* ═══════════════════════════════════════════════════════
   HOME
   ═══════════════════════════════════════════════════════ */
function renderHome(){
  const db = loadData();
  const total = db.skins.length;
  const heroesWithSkins = new Set(db.skins.map(s=>s.heroId)).size;
  const variantsOwned = db.skins.reduce((a,s)=>a+(s.variants||[]).filter(v=>v.owned).length,0);
  return `
    <div class="page-header ow-page"><div><div class="page-title ow-accent">MA COLLECTION</div><div style="color:var(--text-muted);font-size:.8rem;margin-top:4px;letter-spacing:.1em">OW VAULT · BLOODY</div></div></div>
    <div class="home-stats">
      <div class="stat-block"><div class="stat-number">${total}</div><div class="stat-label">Skins possédés</div></div>
      <div class="stat-block"><div class="stat-number">${heroesWithSkins}<span style="font-size:1.1rem;color:var(--text-muted)">/${HEROES.length}</span></div><div class="stat-label">Héros avec skins</div></div>
      <div class="stat-block"><div class="stat-number">${variantsOwned}</div><div class="stat-label">Variantes possédées</div></div>
    </div>
    <div class="rarity-overview">
      <div class="lbl">Répartition par rareté</div>
      <div class="rarity-track">${RARITIES.map(r=>{ const c=db.skins.filter(s=>s.rarity===r).length; const pct=total?(c/total*100):0; if(pct===0) return ''; const bg = r==='Mythic' ? 'linear-gradient(90deg,var(--mythic-a),var(--mythic-b))' : RARITY_HEX[r]; return `<span style="width:${pct}%;background:${bg}"></span>`; }).join('')}</div>
      <div class="rarity-track-legend">${RARITIES.map(r=>{ const c=db.skins.filter(s=>s.rarity===r).length; const sw = r==='Mythic' ? 'background:linear-gradient(135deg,var(--mythic-a),var(--mythic-b))' : `background:${RARITY_HEX[r]}`; return `<span class="li"><span class="sw" style="${sw}"></span>${RARITY_LABEL[r]} · ${c}</span>`; }).join('')}</div>
    </div>
    <div class="home-grid">
      <div class="game-card tank" onclick="navigate('tank')"><div class="game-card-icon">🛡️</div><div class="game-card-name">Tank</div><div class="game-card-count">${HEROES.filter(h=>h.role==='tank').length} héros</div></div>
      <div class="game-card damage" onclick="navigate('damage')"><div class="game-card-icon">⚔️</div><div class="game-card-name">Dégâts</div><div class="game-card-count">${HEROES.filter(h=>h.role==='damage').length} héros</div></div>
      <div class="game-card support" onclick="navigate('support')"><div class="game-card-icon">✚</div><div class="game-card-name">Soutien</div><div class="game-card-count">${HEROES.filter(h=>h.role==='support').length} héros</div></div>
      <div class="game-card rand" onclick="navigate('random')"><div class="game-card-icon">🎲</div><div class="game-card-name">Randomizer</div><div class="game-card-count">Choix aléatoire</div></div>
    </div>
    ${renderRecentList(db)}`;
}
function renderRecentList(db){
  const recent = [...db.skins].sort((a,b)=>idTimestamp(b.id)-idTimestamp(a.id)).slice(0,8);
  if(recent.length===0) return '';
  return `
    <div style="font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:.06em;font-size:.95rem;color:var(--text-dim);margin-bottom:12px">🕘 AJOUTÉS RÉCEMMENT</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      ${recent.map(s=>{
        const hero = HEROMAP[s.heroId];
        return `<div style="display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;cursor:pointer" onclick="openHeroPage('${esc(s.heroId)}')">
          <span class="skin-rarity-label ${esc(s.rarity)}" style="min-width:70px">${RARITY_LABEL[s.rarity]}</span>
          <span style="font-weight:600;font-size:.85rem;flex:1">${esc(s.name)}</span>
          <span style="color:var(--text-muted);font-size:.78rem">${esc(hero.name)}</span>
        </div>`;
      }).join('')}
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   ROLE PAGE (hero grid)
   ═══════════════════════════════════════════════════════ */
function renderRolePage(role){
  const info = ROLE_INFO[role];
  const heroes = HEROES.filter(h=>h.role===role);
  return `
    <div class="page-header ${role}-page"><div class="page-title ${role}-accent">${info.icon} ${info.label.toUpperCase()}</div><span class="count-badge">${heroes.length} héros</span></div>
    <div class="hero-grid">
      ${heroes.map(h=>{
        const count = ownedSkinCount(h.id);
        return `<div class="hero-card" onclick="openHeroPage('${esc(h.id)}')">
          <div class="hero-avatar" style="background:${heroGradient(h.role)}">${initials(h.name)}</div>
          <div class="hname">${esc(h.name)}</div>
          <div class="hcount"><b>${count}</b> skin${count!==1?'s':''}</div>
        </div>`;
      }).join('')}
    </div>`;
}

/* ═══════════════════════════════════════════════════════
   HERO DETAIL PAGE
   ═══════════════════════════════════════════════════════ */
let _heroSearch = '';
let _heroRarityFilter = 'all';
let _heroSort = 'recent';

function renderHeroPage(heroId){
  const hero = HEROMAP[heroId];
  const info = ROLE_INFO[hero.role];
  _heroSearch=''; _heroRarityFilter='all'; _heroSort='recent';
  return `
    <div class="backlink" onclick="navigate('${hero.role}')">← Retour · ${info.label}</div>
    <div class="page-header ${hero.role}-page">
      <div style="display:flex;align-items:center;gap:14px">
        <div class="hero-avatar" style="width:52px;height:52px;font-size:1.1rem;background:${heroGradient(hero.role)}">${initials(hero.name)}</div>
        <div><div class="page-title" style="font-size:1.7rem">${esc(hero.name)}</div><div style="color:${info.hex};font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin-top:2px">${info.label}</div></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="heroRandomize('${esc(heroId)}')">🎲 Random</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleSelectMode()">☑ Sélectionner</button>
        <button class="btn btn-primary btn-sm" onclick="openSkinModal(null,'${esc(heroId)}')">➕ Ajouter un skin</button>
      </div>
    </div>
    <div id="select-bar-container"></div>
    <div class="search-bar">
      <div class="search-input-wrap"><span class="search-icon">🔍</span><input type="text" placeholder="Rechercher un skin…" id="hero-search" oninput="heroFilter()"></div>
      <select id="hero-sort" onchange="heroSortChange()" style="max-width:190px">
        <option value="recent">Plus récents</option>
        <option value="az">Alphabétique (A→Z)</option>
        <option value="rarity">Par rareté</option>
        <option value="manual">Ordre manuel</option>
      </select>
    </div>
    <div class="filter-bar" id="hero-rarity-filter">
      <button class="filter-btn active" data-rarity="all" onclick="heroRarFilter(this,'all')">Toutes</button>
      ${RARITIES.map(r=>`<button class="filter-btn" data-rarity="${r}" onclick="heroRarFilter(this,'${r}')">${RARITY_LABEL[r]}</button>`).join('')}
    </div>
    <div class="skins-grid" id="hero-grid">${renderHeroSkinGrid(heroId)}</div>`;
}

function getHeroSkinsSorted(heroId){
  let list = skinsForHero(heroId);
  const rarityOrder = {Common:0,Rare:1,Epic:2,Legendary:3,Mythic:4};
  if(_heroSort==='az') list.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  else if(_heroSort==='recent') list.sort((a,b)=>idTimestamp(b.id)-idTimestamp(a.id));
  else if(_heroSort==='rarity') list.sort((a,b)=>rarityOrder[b.rarity]-rarityOrder[a.rarity]);
  else if(_heroSort==='manual') list.sort((a,b)=>(a.order||0)-(b.order||0));
  return list;
}

function renderHeroSkinGrid(heroId){
  const list = getHeroSkinsSorted(heroId);
  if(list.length===0) return `<div class="empty-state"><div class="icon">🦾</div><p>Aucun skin pour l'instant.<br>Ajoute-en avec <strong>➕ Ajouter un skin</strong>.</p></div>`;
  return list.map((s,idx)=>{
    const variants = s.variants||[];
    const ownedV = variants.filter(v=>v.owned).length;
    return `
    <div class="skin-card" data-rarity="${esc(s.rarity)}" data-name="${esc(s.name.toLowerCase())}" data-id="${esc(s.id)}" onclick="skinCardClick(event,'${esc(s.id)}','${esc(heroId)}')">
      <div class="rarity-bar ${esc(s.rarity)}"></div>
      <div class="skin-info">
        <div class="skin-name">${esc(s.name)}</div>
        <div class="skin-meta"><span class="skin-rarity-label ${esc(s.rarity)}">${RARITY_LABEL[s.rarity]}</span>${_heroSort==='manual' ? `<span style="display:flex;gap:3px" onclick="event.stopPropagation()"><button class="card-btn" style="width:22px;height:18px;font-size:.6rem;position:static;opacity:1" onclick="moveSkin('${esc(s.id)}','${esc(heroId)}',-1)" ${idx===0?'disabled':''}>▲</button><button class="card-btn" style="width:22px;height:18px;font-size:.6rem;position:static;opacity:1" onclick="moveSkin('${esc(s.id)}','${esc(heroId)}',1)" ${idx===list.length-1?'disabled':''}>▼</button></span>` : ''}</div>
        ${hasVariants(s.rarity) ? `<div class="skin-variant-tag">🎨 ${ownedV}/${variants.length} variante${variants.length!==1?'s':''}</div>` : ''}
        ${s.notes ? `<div class="skin-note" title="${esc(s.notes)}">📝 ${esc(s.notes)}</div>` : ''}
      </div>
      <div class="card-actions" onclick="event.stopPropagation()">
        <button class="card-btn card-btn-edit" onclick="openSkinModal('${esc(s.id)}','${esc(heroId)}')">✏</button>
        <button class="card-btn card-btn-delete" onclick="deleteSkin('${esc(s.id)}','${esc(heroId)}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

function skinCardClick(e, skinId, heroId){
  const card = e.currentTarget;
  if(_selectMode){ e.stopPropagation(); toggleSelectCard(card, skinId); return; }
  openSkinDetailModal(skinId, heroId);
}
function heroFilter(){
  _heroSearch = document.getElementById('hero-search').value.toLowerCase();
  applyHeroFilters();
}
function heroRarFilter(btn, r){
  document.querySelectorAll('#hero-rarity-filter .filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  _heroRarityFilter = r;
  applyHeroFilters();
}
function applyHeroFilters(){
  document.querySelectorAll('#hero-grid .skin-card').forEach(c=>{
    const matchQ = !_heroSearch || c.dataset.name.includes(_heroSearch);
    const matchR = _heroRarityFilter==='all' || c.dataset.rarity===_heroRarityFilter;
    c.style.display = (matchQ && matchR) ? '' : 'none';
  });
}
function heroSortChange(){
  _heroSort = document.getElementById('hero-sort').value;
  document.getElementById('hero-grid').innerHTML = renderHeroSkinGrid(currentHeroId);
  applyHeroFilters();
}
function moveSkin(skinId, heroId, dir){
  const list = getHeroSkinsSorted(heroId);
  const i = list.findIndex(s=>s.id===skinId);
  const j = i+dir;
  if(j<0||j>=list.length) return;
  const db = loadData();
  const a = db.skins.find(s=>s.id===list[i].id), b = db.skins.find(s=>s.id===list[j].id);
  const tmp = a.order||0; a.order=b.order||0; b.order=tmp;
  saveData(db);
  document.getElementById('hero-grid').innerHTML = renderHeroSkinGrid(heroId);
}
function heroRandomize(heroId){
  const list = skinsForHero(heroId);
  if(list.length===0){ showToast('Aucun skin possédé pour ce héros.','error'); return; }
  const pick = list[Math.floor(Math.random()*list.length)];
  let extra = '';
  if(hasVariants(pick.rarity)){
    const owned = (pick.variants||[]).filter(v=>v.owned);
    if(owned.length>0) extra = ' — variante : ' + owned[Math.floor(Math.random()*owned.length)].name;
  }
  showToast(`🎲 ${pick.name}${extra}`);
}

/* SELECT MODE */
let _selectMode = false;
let _selected = new Set();
function toggleSelectMode(){
  _selectMode = !_selectMode; _selected.clear();
  renderSelectBar();
  document.querySelectorAll('#hero-grid .skin-card').forEach(c=>{ c.classList.toggle('selectable',_selectMode); c.classList.remove('selected'); });
}
function _exitSelectMode(silent){
  _selectMode = false; _selected.clear();
  const bar = document.getElementById('select-bar-container'); if(bar) bar.innerHTML='';
}
function renderSelectBar(){
  const el = document.getElementById('select-bar-container');
  if(!el) return;
  if(!_selectMode){ el.innerHTML=''; return; }
  el.innerHTML = `<div class="select-mode-bar"><span><b id="sel-count">${_selected.size}</b> sélectionné(s)</span>
    <button class="btn btn-sm btn-danger" onclick="bulkDeleteSelected()">Supprimer la sélection</button>
    <button class="btn btn-sm btn-ghost" onclick="toggleSelectMode()">Annuler</button></div>`;
}
function toggleSelectCard(card, skinId){
  if(_selected.has(skinId)){ _selected.delete(skinId); card.classList.remove('selected'); }
  else { _selected.add(skinId); card.classList.add('selected'); }
  renderSelectBar();
}
function bulkDeleteSelected(){
  if(_selected.size===0) return;
  if(!confirm(`Supprimer ${_selected.size} skin(s) sélectionné(s) ?`)) return;
  const db = loadData();
  db.skins = db.skins.filter(s=>!_selected.has(s.id));
  saveData(db);
  _selectMode=false; _selected.clear();
  showToast('Skins supprimés ✓');
  refresh();
}

/* ═══════════════════════════════════════════════════════
   SKIN CRUD (add/edit modal)
   ═══════════════════════════════════════════════════════ */
let _modalRarity = 'Common';
function openSkinModal(skinId, heroId){
  const editing = !!skinId;
  const db = loadData();
  const s = editing ? db.skins.find(x=>x.id===skinId) : null;
  _modalRarity = s ? s.rarity : 'Common';
  openModal(editing ? 'Modifier le skin' : 'Ajouter un skin', `
    <div class="form-section">
      <div class="form-row single">
        <div class="form-group"><label>Nom du skin</label><input type="text" id="f-skin-name" value="${s?esc(s.name):''}" placeholder="Ex : Oni, Cybernétique, Nano-Cola..."></div>
      </div>
      <div class="form-row single">
        <div class="form-group"><label>Rareté</label><div class="rarity-select" id="f-rarity-select">${RARITIES.map(r=>`<div class="rarity-opt" data-rarity="${r}" onclick="setModalRarity('${r}')">${RARITY_LABEL[r]}</div>`).join('')}</div></div>
      </div>
      <div class="form-row single">
        <div class="form-group"><label>Notes (optionnel)</label><textarea id="f-skin-notes" placeholder="Ex : obtenu via caisse événement...">${s?esc(s.notes||''):''}</textarea></div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveSkinModal(${editing?`'${esc(skinId)}'`:'null'},'${esc(heroId)}')">Enregistrer</button>
    </div>`);
  setTimeout(()=>{ refreshRarityActive(); document.getElementById('f-skin-name').focus(); },30);
}
function setModalRarity(r){ _modalRarity = r; refreshRarityActive(); }
function refreshRarityActive(){
  document.querySelectorAll('.rarity-opt').forEach(el=>{
    const r = el.dataset.rarity;
    const bg = r==='Mythic' ? 'linear-gradient(135deg,var(--mythic-a),var(--mythic-b))' : RARITY_HEX[r];
    if(r===_modalRarity){ el.classList.add('active'); el.style.background = bg; }
    else { el.classList.remove('active'); el.style.background='var(--bg4)'; }
  });
}
function saveSkinModal(skinId, heroId){
  const name = document.getElementById('f-skin-name').value.trim();
  const notes = document.getElementById('f-skin-notes').value.trim();
  if(!name){ showToast('Le nom du skin est requis.','error'); return; }
  const db = loadData();
  if(skinId){
    const s = db.skins.find(x=>x.id===skinId);
    s.name=name; s.notes=notes; s.rarity=_modalRarity;
    if(!hasVariants(s.rarity)) s.variants=[];
    if(!s.variants) s.variants=[];
  }else{
    const maxOrder = Math.max(0, ...db.skins.filter(x=>x.heroId===heroId).map(x=>x.order||0));
    db.skins.push({ id:generateId('skin'), heroId, name, rarity:_modalRarity, notes, order:maxOrder+1, variants:[] });
  }
  saveData(db);
  closeModal(); showToast('Skin enregistré ✓');
  refresh();
}
function deleteSkin(skinId, heroId){
  if(!confirm('Supprimer ce skin ?')) return;
  const db = loadData();
  db.skins = db.skins.filter(s=>s.id!==skinId);
  saveData(db);
  showToast('Skin supprimé ✓');
  refresh();
}

/* SKIN DETAIL MODAL (variants for Legendary/Mythic) */
function openSkinDetailModal(skinId, heroId){
  const db = loadData();
  const s = db.skins.find(x=>x.id===skinId);
  if(!s) return;
  const rarityColor = s.rarity==='Mythic' ? 'linear-gradient(90deg,var(--mythic-a),var(--mythic-b))' : RARITY_HEX[s.rarity];
  const variants = s.variants||[];
  openModal(s.name, `
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <span style="padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:${rarityColor};color:#07070a">${RARITY_LABEL[s.rarity]}</span>
      <span style="padding:5px 14px;border-radius:20px;font-size:.72rem;font-weight:600;background:var(--bg3);color:var(--text-dim);border:1px solid var(--border)">${esc(HEROMAP[s.heroId].name)}</span>
    </div>
    ${s.notes?`<div style="background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:18px;font-size:.85rem;color:var(--text-dim);white-space:pre-wrap">📝 ${esc(s.notes)}</div>`:''}
    ${hasVariants(s.rarity) ? `
      <div class="variant-section">
        <div class="vtitle">🎨 Variantes (${variants.filter(v=>v.owned).length}/${variants.length})</div>
        <div id="variant-chip-wrap">${variants.map(v=>variantChipHtml(s.id,v)).join('') || `<div style="font-size:.78rem;color:var(--text-muted);font-style:italic;margin-bottom:8px">Aucune variante enregistrée pour l'instant.</div>`}</div>
        <div class="variant-add-row">
          <input type="text" id="f-variant-name" placeholder="Nouvelle variante (ex : Rouge, Été...)">
          <button class="btn btn-primary btn-sm" onclick="addVariant('${esc(s.id)}')">+ Ajouter</button>
        </div>
      </div>` : `<p style="color:var(--text-muted);font-size:.8rem">Les variantes ne s'appliquent qu'aux skins Légendaires et Mythiques.</p>`}
    <div class="btn-row" style="justify-content:space-between">
      <button class="btn btn-ghost btn-sm" onclick="closeModal();openSkinModal('${esc(s.id)}','${esc(s.heroId)}')">✏ Modifier le skin</button>
      <button class="btn btn-ghost" onclick="closeModal()">Fermer</button>
    </div>
  `);
  const input = document.getElementById('f-variant-name');
  if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') addVariant(s.id); });
}
function variantChipHtml(skinId, v){
  return `<span class="variant-chip ${v.owned?'owned':''}" data-var="${esc(v.id)}">
    <span class="vdot" onclick="toggleVariantOwned('${esc(skinId)}','${esc(v.id)}')"></span>
    <span class="vname" onclick="toggleVariantOwned('${esc(skinId)}','${esc(v.id)}')">${esc(v.name)}</span>
    <span class="vdel" onclick="deleteVariant('${esc(skinId)}','${esc(v.id)}')">✕</span>
  </span>`;
}
function refreshVariantWrap(skinId){
  const db = loadData();
  const s = db.skins.find(x=>x.id===skinId);
  const wrap = document.getElementById('variant-chip-wrap');
  if(wrap) wrap.innerHTML = (s.variants||[]).map(v=>variantChipHtml(s.id,v)).join('') || `<div style="font-size:.78rem;color:var(--text-muted);font-style:italic;margin-bottom:8px">Aucune variante enregistrée pour l'instant.</div>`;
  const titleEl = document.querySelector('.variant-section .vtitle');
  if(titleEl) titleEl.textContent = `🎨 Variantes (${(s.variants||[]).filter(v=>v.owned).length}/${(s.variants||[]).length})`;
}
function addVariant(skinId){
  const input = document.getElementById('f-variant-name');
  const name = (input.value||'').trim();
  if(!name) return;
  const db = loadData();
  const s = db.skins.find(x=>x.id===skinId);
  if(!s.variants) s.variants=[];
  s.variants.push({id:generateId('var'), name, owned:true});
  saveData(db);
  input.value='';
  refreshVariantWrap(skinId);
}
function toggleVariantOwned(skinId, varId){
  const db = loadData();
  const s = db.skins.find(x=>x.id===skinId);
  const v = (s.variants||[]).find(v=>v.id===varId);
  if(v){ v.owned=!v.owned; saveData(db); refreshVariantWrap(skinId); }
}
function deleteVariant(skinId, varId){
  const db = loadData();
  const s = db.skins.find(x=>x.id===skinId);
  s.variants = (s.variants||[]).filter(v=>v.id!==varId);
  saveData(db); refreshVariantWrap(skinId);
}

/* ═══════════════════════════════════════════════════════
   RANDOMIZER PAGE
   ═══════════════════════════════════════════════════════ */
let _randRole = 'all';
function renderRandomPage(){
  _randRole = 'all';
  return `
    <div class="page-header ow-page"><div class="page-title ow-accent">RANDOMIZER</div></div>
    <div class="rand-page">
      <div class="rand-step">
        <div class="rand-step-title"><span class="step-num">1</span>Filtrer par rôle</div>
        <div class="role-filter-grid" id="rand-role-filters">
          <div class="role-filter-pill active" data-role="all" onclick="randSetRole(this,'all')">Tous les rôles</div>
          <div class="role-filter-pill" data-role="tank" onclick="randSetRole(this,'tank')">🛡️ Tank</div>
          <div class="role-filter-pill" data-role="damage" onclick="randSetRole(this,'damage')">⚔️ Dégâts</div>
          <div class="role-filter-pill" data-role="support" onclick="randSetRole(this,'support')">✚ Soutien</div>
        </div>
      </div>
      <div class="rand-step">
        <div class="rand-step-title"><span class="step-num">2</span>Tirer un héros + un skin possédés</div>
        <button class="btn rand-btn" id="rand-go-btn" onclick="runRandomizer()">🎲 Lancer le randomizer</button>
        <div id="rand-result"></div>
      </div>
    </div>`;
}
function randSetRole(btn, role){
  document.querySelectorAll('#rand-role-filters .role-filter-pill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  _randRole = role;
}
function runRandomizer(){
  const btn = document.getElementById('rand-go-btn');
  btn.classList.remove('spinning'); void btn.offsetWidth; btn.classList.add('spinning');
  const db = loadData();
  let pool = HEROES.filter(h=> db.skins.some(s=>s.heroId===h.id));
  if(_randRole!=='all') pool = pool.filter(h=>h.role===_randRole);
  const resultEl = document.getElementById('rand-result');
  if(pool.length===0){
    resultEl.innerHTML = `<div class="rand-empty">Aucun skin possédé pour ce filtre. Ajoute des skins d'abord.</div>`;
    return;
  }
  const hero = pool[Math.floor(Math.random()*pool.length)];
  const skins = db.skins.filter(s=>s.heroId===hero.id);
  const skin = skins[Math.floor(Math.random()*skins.length)];
  const info = ROLE_INFO[hero.role];
  let variantLine = '';
  if(hasVariants(skin.rarity)){
    const owned = (skin.variants||[]).filter(v=>v.owned);
    if(owned.length>0){
      const v = owned[Math.floor(Math.random()*owned.length)];
      variantLine = `<div class="rand-result-variant">Variante : <strong style="color:var(--text)">${esc(v.name)}</strong></div>`;
    }
  }
  resultEl.innerHTML = `
    <div class="rand-result-card" data-rarity="${esc(skin.rarity)}">
      <div class="rand-result-avatar" style="background:${heroGradient(hero.role)}">${initials(hero.name)}</div>
      <div class="rand-result-role" style="color:${info.hex}">${info.icon} ${info.label}</div>
      <div class="rand-result-hero">${esc(hero.name)}</div>
      <div class="rand-result-skin" style="color:${skin.rarity==='Mythic'?'var(--mythic-a)':RARITY_HEX[skin.rarity]}">${esc(skin.name)} · ${RARITY_LABEL[skin.rarity]}</div>
      ${variantLine}
    </div>`;
}

   INIT

navigate('home');
